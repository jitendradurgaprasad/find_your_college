services:
  # FastAPI Web Service
  - type: web
    name: find-your-college-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.3
      - key: DATABASE_URL
        value: sqlite:///./find_your_college.db
      - key: CRAWLER_API_SECRET
        generateValue: true
      - key: MAX_CRAWL_DEPTH
        value: 2
      - key: MAX_PAGES_PER_SITE
        value: 30
      - key: REQUEST_DELAY_SECONDS
        value: 0.8
